[package]
name = "multilayer-fmc-tfm"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Three-layer FMC-TFM reconstruction preserving MATLAB conventions"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"

[[bin]]
name = "tfm-rs"
path = "src/main.rs"
